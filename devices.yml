########################################################################
# Basic anchors                                                        #
########################################################################

.devtools_packages:
  packages: &devtools_packages
    - droidian-devtools
    - adaptation-hybris-devtools

.samsung_a13_packages:
  packages: &samsung_a13_packages
    - adaptation-samsung-a13
    - adaptation-samsung-a13-configs

########################################################################
# Recovery-flashable rootfses                                          #
########################################################################

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

########################################################################
# Device specific images                                               #
########################################################################
# samsung

samsung_a13:
  type: image
  arch: arm64
  edition: plamo_wf_experimental
  variant: phone
  apilevel: 33

  packages: *samsung_a13_packages
